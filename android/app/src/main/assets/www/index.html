<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <title>Slot Machine</title>
    <link rel="stylesheet" href="bootstrap-reboot.min.css" />
    <script defer="defer" src="bundle.0e668c1125af2f8b7491.js"></script>
    <link href="main.425932f16a931f903b05.css" rel="stylesheet" />
  </head>
  <body>
    <div id="slot">
      <div id="moneyBar">
        <div class="money-item">
          <span class="money-icon">💰</span>
          <span class="money-label">Money</span>
          <span id="playerMoney" class="money-value">0</span>
        </div>
        <div class="money-item">
          <span class="money-icon">🎲</span>
          <span class="money-label">Bet</span>
          <span id="betDisplay" class="money-value bet">100</span>
        </div>
        <div class="money-item">
          <span class="money-icon">🏆</span>
          <span class="money-label">Jackpot</span>
          <span id="jp" class="money-value jackpot">5.555.555</span>
        </div>
      </div>
      <div id="winMessage">
        <span>Pull the lever!</span> <span id="connectionStatus"></span>
      </div>
      <div id="reels">
        <div class="reel"></div>
        <div class="reel"></div>
        <div class="reel"></div>
        <div class="reel"></div>
        <div class="reel"></div>
      </div>
      <div id="controls">
        <button type="button" id="spin" disabled="disabled">SPIN</button>
        <label
          ><input type="checkbox" name="autoplay" id="autoplay" />
          Autoplay</label
        >
      </div>
    </div>
  </body>
</html>

name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install Android SDK
        run: |
          # Download and install command-line tools
          ANDROID_SDK=/usr/local/lib/android/sdk
          mkdir -p $ANDROID_SDK/cmdline-tools
          curl -sL -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d /tmp/
          mv /tmp/cmdline-tools/cmdline-tools $ANDROID_SDK/cmdline-tools/latest

          # Accept licenses and install SDK components
          yes | $ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK --install \
            "platforms;android-34" \
            "build-tools;34.0.0" 2>&1

          # Set environment variables
          echo "ANDROID_HOME=$ANDROID_SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> $GITHUB_ENV
          echo "$ANDROID_SDK/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK/platform-tools" >> $GITHUB_PATH

          # Verify installation
          echo "SDK installed at $ANDROID_SDK"
          ls $ANDROID_SDK/platforms/
          ls $ANDROID_SDK/build-tools/

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Build web app
        run: |
          cd ..
          npm ci
          npm run build

      - name: Prepare assets
        run: |
          cd ..
          mkdir -p android/app/src/main/assets/www
          cp -r dist/* android/app/src/main/assets/www/
          curl -sL -o android/app/src/main/assets/www/bootstrap-reboot.min.css \
            "https://unpkg.com/bootstrap@5.2.3/dist/css/bootstrap-reboot.min.css"
          sed -i 's|https://unpkg.com/bootstrap@5.2.3/dist/css/bootstrap-reboot.min.css|bootstrap-reboot.min.css|' \
            android/app/src/main/assets/www/index.html

      - name: Build APK
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          cat local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: slot-machine-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

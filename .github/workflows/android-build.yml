name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build web app
        run: |
          npm ci
          npm run build

      - name: Prepare Android assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r dist/* android/app/src/main/assets/www/

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK
        run: |
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "Building APK..."
          # Retry up to 3 times for network issues
          for i in 1 2 3; do
            echo "=== Build attempt $i ==="
            ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle.log
            STATUS=${PIPESTATUS[0]}
            if [ $STATUS -eq 0 ]; then
              echo "BUILD SUCCESS on attempt $i"
              break
            fi
            echo "BUILD FAILED (attempt $i), retrying..."
            sleep 10
          done
          echo "BUILD EXIT CODE: $STATUS"
        shell: bash

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: slot-machine-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Gradle log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: android/gradle.log
          retention-days: 7

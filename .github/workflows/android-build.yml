name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Print environment
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          which sdkmanager || echo "sdkmanager not in PATH"
          ls -la ${ANDROID_HOME}/ 2>/dev/null | head -10
          echo "=== command line tools ==="
          ls ${ANDROID_HOME}/cmdline-tools/latest/bin/ 2>/dev/null || echo "no cmdline-tools"
          echo "=== existing platforms ==="
          ls ${ANDROID_HOME}/platforms/ 2>/dev/null || echo "no platforms"
          echo "=== existing build-tools ==="
          ls ${ANDROID_HOME}/build-tools/ 2>/dev/null || echo "no build-tools"

      - name: Install SDK components
        run: |
          yes | sdkmanager --sdk_root=${ANDROID_HOME} \
            "platforms;android-34" \
            "build-tools;34.0.0" 2>&1
          echo "=== installed ==="
          ls ${ANDROID_HOME}/platforms/
          ls ${ANDROID_HOME}/build-tools/

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Build web app
        run: |
          npm ci
          npm run build

      - name: Prepare Android assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r dist/* android/app/src/main/assets/www/
          curl -sL -o android/app/src/main/assets/www/bootstrap-reboot.min.css \
            "https://unpkg.com/bootstrap@5.2.3/dist/css/bootstrap-reboot.min.css"
          sed -i 's|https://unpkg.com/bootstrap@5.2.3/dist/css/bootstrap-reboot.min.css|bootstrap-reboot.min.css|' \
            android/app/src/main/assets/www/index.html

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          cat local.properties
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1
        shell: bash

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: slot-machine-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

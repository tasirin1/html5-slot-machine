<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Slot Machine</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/bootstrap@5.2.3/dist/css/bootstrap-reboot.min.css"
    />
  </head>
  <body>
    <div id="slot">
      <!-- TOP BAR: Money | Jackpot -->
      <div id="topBar">
        <div class="left">
          <div class="money-display">
            <span class="label">💰</span>
            <span id="playerMoney" class="value">0</span>
            <span class="label" style="margin: 0 4px 0 10px">BET</span>
            <span id="betDisplay" class="value bet">100</span>
          </div>
          <div class="jackpot-display">
            <span class="label">JACKPOT</span>
            <span id="jp" class="value">5.555.555</span>
          </div>
        </div>
      </div>

      <!-- WIN MESSAGE + STATUS -->
      <div id="winMessage">
        <span id="winText">🎰 Good luck!</span>
        <span id="connectionStatus"></span>
      </div>

      <!-- REELS -->
      <div id="reels">
        <div class="reel"></div>
        <div class="reel"></div>
        <div class="reel"></div>
        <div class="reel"></div>
        <div class="reel"></div>
      </div>

      <!-- CONTROLS -->
      <div id="controls">
        <button type="button" id="spin" disabled>SPIN</button>
        <label>
          <input type="checkbox" id="autoplay" />
          Auto
        </label>
      </div>
    </div>
  </body>
</html>

<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Slot Machine</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/bootstrap@5.2.3/dist/css/bootstrap-reboot.min.css"
    />
  </head>
  <body>
    <div id="slot">
      <!-- Money Bar -->
      <div id="moneyBar">
        <div class="money-item">
          <span class="money-icon">💰</span>
          <span class="money-label">Money</span>
          <span id="playerMoney" class="money-value">0</span>
        </div>
        <div class="money-item">
          <span class="money-icon">🎲</span>
          <span class="money-label">Bet</span>
          <span id="betDisplay" class="money-value bet">100</span>
        </div>
        <div class="money-item">
          <span class="money-icon">🏆</span>
          <span class="money-label">Jackpot</span>
          <span id="jp" class="money-value jackpot">5.555.555</span>
        </div>
      </div>

      <!-- Win Message -->
      <div id="winMessage">
        <span>Pull the lever!</span>
        <span id="connectionStatus"></span>
      </div>

      <!-- Reels -->
      <div id="reels">
        <div class="reel"></div>
        <div class="reel"></div>
        <div class="reel"></div>
        <div class="reel"></div>
        <div class="reel"></div>
      </div>

      <!-- Controls -->
      <div id="controls">
        <button type="button" id="spin" disabled>SPIN</button>
        <label>
          <input type="checkbox" name="autoplay" id="autoplay" />
          Autoplay
        </label>
      </div>
    </div>
  </body>
</html>

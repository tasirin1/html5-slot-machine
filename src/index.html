<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Slot 777</title>
    <link rel="stylesheet" href="bootstrap-reboot.min.css" />
  </head>
  <body>
    <div id="app">
      <!-- ===== LOGIN SCREEN ===== -->
      <div id="loginScreen">
        <div class="login-box">
          <div class="login-title">🎰 SLOT 777</div>
          <div class="login-sub">Enter your credentials</div>
          <input
            type="text"
            id="loginUser"
            placeholder="Username"
            autocomplete="off"
          />
          <input
            type="password"
            id="loginPin"
            placeholder="PIN"
            inputmode="numeric"
          />
          <div id="loginError" class="login-error"></div>
          <button id="loginBtn" class="login-btn">PLAY</button>
          <div class="login-hint">Ask admin for your account</div>
        </div>
      </div>

      <!-- ===== GAME SCREEN ===== -->
      <div id="gameScreen" style="display: none">
        <div id="topBar">
          <div class="left">
            <span id="playerNameDisplay" class="player-name"></span>
            <div class="money-display">
              <span class="label">💰</span>
              <span id="playerMoney" class="value">0</span>
              <span class="label" style="margin: 0 4px 0 10px">BET</span>
              <span id="betDisplay" class="value bet">100</span>
            </div>
          </div>
          <button id="logoutBtn" class="logout-btn">✕</button>
        </div>

        <div id="winMessage"><span id="winText">🎰 Pull the lever!</span></div>

        <div id="reels">
          <div class="reel"></div>
          <div class="reel"></div>
          <div class="reel"></div>
          <div class="reel"></div>
          <div class="reel"></div>
        </div>

        <div id="controls">
          <button type="button" id="spin" disabled>SPIN</button>
          <label><input type="checkbox" id="autoplay" /> Auto</label>
        </div>
      </div>
    </div>
  </body>
</html>
